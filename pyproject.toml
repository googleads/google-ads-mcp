[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-ads-mcp-extended"
version = "0.1.0"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "google-ads>=33.0.0",
    "mcp[cli]>=2.0.0,<3",
    "fastmcp>=4.0.6,<5"
]

description = "Community extended MCP Server for Google Ads with safe read & write (Search mutations, negatives and proposals)."
readme = "README.md"
authors = [
    { name = "Edd Vásquez", email = "eddisonv@gmail.com" },
    { name = "Dean Lukies", email = "lukiesd@users.noreply.github.com" },
    { name = "Mattia Tommasone", email = "Raibaz@users.noreply.github.com" },
    { name = "Ben Karl", email = "benrkarl@users.noreply.github.com" },
]
keywords = ["Google Ads", "Google Ads API", "MCP", "mutations", "campaigns", "automation"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python"
]

[project.optional-dependencies]
dev = [
    "black",
    "nox >=2025.5.1, <2026"
]
firestore = [
    # 0.4.5 is the first release exposing the Firestore sanitization strategies.
    "py-key-value-aio[firestore] >=0.4.5, <0.5.0"
]

[project.urls]
homepage = "https://github.com/eddvasquez/google-ads-mcp"
repository = "https://github.com/eddvasquez/google-ads-mcp.git"
upstream = "https://github.com/googleads/google-ads-mcp"
issues = "https://github.com/eddvasquez/google-ads-mcp/issues"

[project.scripts]
google-ads-mcp = "ads_mcp.server:run_server"
google-ads-mcp-editing = "ads_mcp.extensions.local:run"
google-ads-mcp-update-gaql = "ads_mcp.update_references:update_gaql_resource_file"

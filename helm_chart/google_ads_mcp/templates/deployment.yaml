apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "google-ads-mcp.fullname" . }}
  labels:
    {{- include "google-ads-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "google-ads-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "google-ads-mcp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "google-ads-mcp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "google-ads-mcp.name" . }}
          image: {{ include "google-ads-mcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["google-ads-mcp"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GOOGLE_ADS_MCP_BASE_URL
              value: {{ .Values.app.baseUrl | quote }}
            - name: GOOGLE_ADS_MCP_REDIRECT_PATH
              value: {{ .Values.app.redirectPath | quote }}
            {{- if .Values.app.extraEnv }}
            {{- tpl (toYaml .Values.app.extraEnv) . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.developerToken.name }}
            - secretRef:
                name: {{ .Values.secrets.oauthClient.name }}
            {{- if .Values.secrets.loginCustomer.enabled }}
            - secretRef:
                name: {{ .Values.secrets.loginCustomer.name }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
